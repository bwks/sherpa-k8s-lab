# cert-manager v1.21.3, from its release's static manifest (no Helm). The images it runs are
# pinned to the same version: quay.io/jetstack/cert-manager-{controller,webhook,cainjector}:v1.21.3.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/cert-manager/cert-manager/releases/download/v1.21.3/cert-manager.yaml
