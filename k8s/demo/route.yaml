# Attaches to every listener of the `sherpa` Gateway that admits routes from this namespace:
# HTTP on 80, and HTTPS on 443 once k8s/gateway-tls is applied.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo
  namespace: demo
spec:
  parentRefs:
    - name: sherpa
      namespace: default
  rules:
    - backendRefs:
        - name: echo
          port: 80
